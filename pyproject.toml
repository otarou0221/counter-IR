[project]
name = "cardboard-counter-v2"
version = "0.1.0"
description = "Four-service cardboard counter using only pallet_plane_2roi measurement."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "numpy==2.4.3",
  "opencv-python-headless==4.13.0.92",
  "ortools==9.15.6755",
  "pydantic==2.12.5",
  "psycopg[binary]==3.3.4",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardboard_counter_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
